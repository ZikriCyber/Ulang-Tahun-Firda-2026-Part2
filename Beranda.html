<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page Aesthetic</title>
    <!-- Menghubungkan file HTML dengan file CSS -->
    <link rel="stylesheet" href="Beranda.css">
</head>
<body>
    <!-- Latar Belakang 4 Foto (Sejajar Horizontal) -->
    <!-- Ganti 'src' dengan URL foto online Anda masing-masing -->
    <div class="collage-grid">
        <img src="https://cdn.phototourl.com/member/2026-10-23-b73683b6-b7c2-4567-92db-47b67cf2c634.jpg" alt="Foto 1">
        <img src="https://cdn.phototourl.com/member/2026-10-23-9215dbb8-f0e4-492a-b25c-eb27945ffc49.jpg" alt="Foto 2">
        <img src="https://cdn.phototourl.com/member/2026-10-23-0e06cccd-b202-414a-8a58-6ae720fc7f10.jpg" alt="Foto 3">
        <img src="https://cdn.phototourl.com/member/2026-10-23-4a0cf199-a810-48d2-b792-90a0d9538bbc.jpg" alt="Foto 4">
    </div>

    <!-- Konten Tengah (Teks & Tombol Play) -->
    <div class="overlay-content">
        <!-- Menambahkan ID untuk menargetkan animasi JavaScript -->
        <h1 class="sticker-text" id="animatedText">Welcome</h1>
        
        <!-- Membungkus tombol play dengan tag <a> menuju Surat.html -->
        <a href="Surat.html" style="text-decoration: none;">
            <div class="play-btn">
                <div class="play-icon"></div>
            </div>
        </a>
    </div>

    <!-- Memanggil file JavaScript eksternal yang sudah digabung -->
    <script src="CODE JS.js"></script>
</body>
</html>
